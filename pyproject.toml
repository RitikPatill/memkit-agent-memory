[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memkit"
version = "0.1.0"
description = "Self-hosted memory backend for LLM agents"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
memkit = "memkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
